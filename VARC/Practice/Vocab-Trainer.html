<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAT VARC — Vocabulary Trainer</title>
<style>
:root{
  --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2b303b;
  --tx:#e6e8ec; --dim:#9aa2b1; --acc:#5b9cff; --ok:#3ecf8e; --bad:#ff6b6b;
  --warn:#f6c453; --mark:#a97bff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;}
.wrap{max-width:820px;margin:0 auto;padding:24px 18px 80px}
h1{font-size:24px;margin:0 0 4px} h2{font-size:17px;margin:26px 0 10px}
.sub{color:var(--dim);font-size:13px;margin-bottom:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.setbtn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;
  cursor:pointer;text-align:left;color:var(--tx);font:inherit;transition:.12s}
.setbtn:hover{border-color:var(--acc);transform:translateY(-1px)}
.setbtn .k{font-weight:640;font-size:14px} .setbtn .m{color:var(--dim);font-size:12px;margin-top:3px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex-wrap:wrap}
.seg button{background:transparent;border:0;color:var(--dim);padding:8px 14px;cursor:pointer;font:inherit}
.seg button.on{background:var(--acc);color:#0b0d11;font-weight:600}
.btn{background:var(--acc);color:#0b0d11;border:0;border-radius:9px;padding:10px 18px;
  font:inherit;font-weight:620;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line);font-weight:500}
.btn.ghost:hover{border-color:var(--acc)}
.btn:disabled{opacity:.4;cursor:default}
.hide{display:none!important}
label.lbl{color:var(--dim);font-size:13px;margin-right:2px}

.top{position:sticky;top:0;z-index:5;background:rgba(15,17,21,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:10px 0;margin-bottom:18px}
.top .wrap{padding-top:0;padding-bottom:0}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12px;color:var(--dim)}
.pill.good{border-color:var(--ok);color:#8ee5bd}
.pill.bad{border-color:var(--bad);color:#ffa8a8}
.bar{height:4px;background:var(--panel2);border-radius:999px;overflow:hidden;margin-top:10px}
.bar > i{display:block;height:100%;background:var(--acc);transition:width .2s}

.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.qno{font-size:12px;color:var(--dim);letter-spacing:.04em;text-transform:uppercase}
.prompt{font-size:13px;color:var(--dim);margin-bottom:8px}
.word{font-size:30px;font-weight:680;letter-spacing:-.01em;margin:2px 0 4px}
.pos{font-size:13px;color:var(--dim);font-style:italic;margin-bottom:18px}
.opt{display:flex;gap:11px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:12px 14px;margin-bottom:9px;cursor:pointer;transition:.1s}
.opt:hover{border-color:#3c4557}
.opt.correct{border-color:var(--ok);background:#14291f}
.opt.wrong{border-color:var(--bad);background:#2b1919}
.opt.locked{cursor:default}
.opt .lab{width:22px;height:22px;flex:0 0 22px;border-radius:50%;border:1px solid var(--line);
  display:grid;place-items:center;font-size:12px;color:var(--dim)}
.opt.correct .lab{background:var(--ok);color:#0b0d11;border-color:var(--ok)}
.opt.wrong .lab{background:var(--bad);color:#0b0d11;border-color:var(--bad)}
.note{background:var(--panel2);border-left:3px solid var(--acc);border-radius:0 8px 8px 0;
  padding:12px 14px;margin-top:14px;font-size:14px;color:#dfe3ea}
.note.good{border-left-color:var(--ok)} .note.bad{border-left-color:var(--bad)}
.note b{color:#fff}
.note .defn{margin-bottom:6px}
.note .sy{color:var(--dim);font-size:13px}
.note .sy b{color:#cfd6e2;font-weight:600}
.note .ex{margin-top:8px;font-style:italic;color:#c3cad6;font-size:13.5px}
.kbd{display:inline-block;border:1px solid var(--line);border-radius:5px;padding:0 5px;
  font-size:11px;color:var(--dim);background:#12151b}

table{border-collapse:collapse;width:100%;font-size:14px;margin-top:6px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--dim);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
td.w{font-weight:640;white-space:nowrap}
td.d{color:var(--dim)}
.big{font-size:34px;font-weight:700;letter-spacing:-.02em}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:6px 0 18px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
.stat .n{font-size:24px;font-weight:680} .stat .l{color:var(--dim);font-size:12px;margin-top:2px}
.foot{color:var(--dim);font-size:12px;margin-top:28px;line-height:1.7}
</style>
</head>

nged","syn":["unalterable","invariable","fixed"],"ant":["mutable","fluid"],"sent":"He treated the schedule as immutable."},{"w":"indelible","pos":"adj","def":"impossible to remove, wash away or forget","syn":["ineradicable","permanent","lasting"],"ant":["erasable","transient"],"sent":"The visit left an indelible impression."},{"w":"inveterate","pos":"adj","def":"long-established and unlikely ever to change","syn":["habitual","confirmed","chronic"],"ant":["occasional","sporadic"],"sent":"An inveterate optimist, she found the good in it."}]},{"name":"Obscurity and clarity","words":[{"w":"abstruse","pos":"adj","def":"difficult to understand; deeply obscure","syn":["recondite","arcane","impenetrable"],"ant":["accessible","straightforward"],"sent":"The paper is abstruse even for specialists."},{"w":"recondite","pos":"adj","def":"dealing with a subject known to very few","syn":["abstruse","esoteric","obscure"],"ant":["obvious","commonplace"],"sent":"His interests are recondite but not trivial."},{"w":"esoteric","pos":"adj","def":"understood by only a small group with special knowledge","syn":["arcane","cryptic","specialised"],"ant":["exoteric","popular"],"sent":"The debate turned on an esoteric point of procedure."},{"w":"perspicuous","pos":"adj","def":"clearly expressed and easy to understand","syn":["lucid","intelligible","transparent"],"ant":["opaque","muddled"],"sent":"His prose is perspicuous where the subject allows."},{"w":"lucid","pos":"adj","def":"expressed clearly and easy to follow","syn":["coherent","limpid","clear"],"ant":["confusing","obfuscated"],"sent":"A lucid explanation saved an hour of argument."},{"w":"opaque","pos":"adj","def":"hard to understand; not transmitting light","syn":["impenetrable","murky","unfathomable"],"ant":["lucid","pellucid"],"sent":"The rules are opaque to anyone outside the trade."}]},{"name":"Caution and judgement","words":[{"w":"circumspect","pos":"adj","def":"wary and unwilling to take risks","syn":["cautious","guarded","chary"] ,"def":"showing a lack of confidence; easily frightened","syn":["apprehensive","nervous","tremulous"],"ant":["intrepid","audacious"],"sent":"A timorous knock announced the new recruit."},{"w":"pusillanimous","pos":"adj","def":"showing an ignoble lack of courage","syn":["craven","spineless","faint-hearted"],"ant":["valiant","courageous"],"sent":"The retreat was widely called pusillanimous."}]},{"name":"Arrogance","words":[{"w":"hubris","pos":"n","def":"excessive pride or self-confidence, inviting a fall","syn":["arrogance","conceit","presumption"],"ant":["humility","modesty"],"sent":"The expansion was hubris dressed as strategy."},{"w":"supercilious","pos":"adj","def":"behaving as though one is superior to others","syn":["haughty","disdainful","condescending"],"ant":["humble","unassuming"],"sent":"A supercilious glance was his entire reply."},{"w":"imperious","pos":"adj","def":"assuming authority arrogantly; domineering","syn":["overbearing","high-handed","peremptory"],"ant":["meek","submissive"],"sent":"Her imperious manner emptied the room."},{"w":"pompous","pos":"adj","def":"affectedly grand and self-important","syn":["pretentious","grandiose","self-important"],"ant":["modest","down-to-earth"],"sent":"The pompous preamble ran to four pages."}]},{"name":"Humility","words":[{"w":"unassuming","pos":"adj","def":"not pretentious or presumptuous; modest","syn":["unpretentious","retiring","unobtrusive"],"ant":["ostentatious","pretentious"],"sent":"An unassuming man ran the largest fund in the city."},{"w":"abase","pos":"v","def":"to lower in rank, dignity or esteem","syn":["demean","degrade","humble"],"ant":["exalt","elevate"],"sent":"He would not abase himself to keep the contract."},{"w":"self-effacing","pos":"adj","def":"not seeking attention or credit for oneself","syn":["modest","reticent","unobtrusive"],"ant":["boastful","attention-seeking"],"sent":"Her self-effacing account understated her role entirely."}]},{"name":"Diligence","words":[{"w":"assiduous","pos":"adj","def":"showing great care, attention and perseverance","syn":["diligent","industrious","unflagging"],"ant":["negligent","slothful"],"sent":"Assiduous record-keeping saved the case."},{"w":"sedulous","pos":"adj","def":"showing dedication and painstaking effort","syn":["persevering","painstaking","thorough"],"ant":["careless","lax"],"sent":"Two years of sedulous research went into the chapter."},{"w":"tenacious","pos":"adj","def":"holding firmly to a course; persistent","syn":["dogged","unwavering","pertinacious"],"ant":["irresolute","vacillating"],"sent":"She was tenacious in pursuit of the correction."},{"w":"meticulous","pos":"adj","def":"showing great attention to detail; very careful","syn":["scrupulous","exacting","fastidious"],"ant":["slapdash","careless"],"sent":"His meticulous notes made the audit trivial."},{"w":"punctilious","pos":"adj","def":"showing great attention to correct behaviour or detail","syn":["precise","conscientious","exact"],"ant":["lax","casual"],"sent":"He was punctilious about acknowledging sources."}]},{"name":"Laziness and aimlessness","words":[{"w":"indolent","pos":"adj","def":"wanting to avoid exertion; habitually lazy","syn":["slothful","idle","work-shy"],"ant":["industrious","assiduous"],"sent":"An indolent afternoon produced nothing at all."},{"w":"lethargic","pos":"adj","def":"sluggish and lacking energy or enthusiasm","syn":["listless","languid","enervated"],"ant":["energetic","vigorous"],"sent":"The whole team was lethargic after the flight."},{"w":"torpid","pos":"adj","def":"mentally or physically inactive; sluggish","syn":["inert","dormant","sluggish"],"ant":["lively","animated"],"sent":"Trade was torpid through the whole quarter."},{"w":"desultory","pos":"adj","def":"lacking a plan or purpose; jumping from one thing to another","syn":["aimless","haphazard","cursory"],"ant":["methodical","systematic"],"sent":"A desultory search of the archive turned up nothing."}]},{"name":"Insight and learning","words":[{"w":"sagacious","pos":"adj","def":"having keen practical judgement; wise","syn":["shrewd","canny","sage"],"ant":["obtuse","witless"],"sent":"A sagacious appointment steadied the company."},{"w":"perspicacious","pos":"adj","def":"having a ready insight into things","syn":["discerning","penetrating","insightful"],"ant":["undiscerning","obtuse"],"sent":"Her perspicacious reading found the flaw at once."},{"w":"erudite","pos":"adj","def":"having or showing great scholarly knowledge","syn":["learned","scholarly","well-read"],"ant":["ignorant","unlettered"],"sent":"The footnotes alone are erudite enough to publish."},{"w":"astute","pos":"adj","def":"able to assess situations accurately and turn them to advantage","syn":["shrewd","sharp","calculating"],"ant":["naive","gullible"],"sent":"An astute purchase at the bottom of the market."}]},{"name":"Dullness and gullibility","words":[{"w":"obtuse","pos":"adj","def":"annoyingly slow to understand","syn":["dense","imperceptive","dim"],"ant":["perspicacious","astute"],"sent":"He was being deliberately obtuse about the deadline."},{"w":"fatuous","pos":"adj","def":"silly and pointless; complacently foolish","syn":["inane","asinine","vacuous"],"ant":["judicious","sensible"],"sent":"A fatuous remark closed the discussion."},{"w":"credulous","pos":"adj","def":"too ready to believe things; easily deceived","syn":["gullible","trusting","unquestioning"],"ant":["sceptical","incredulous"],"sent":"The scheme preyed on credulous first-time investors."},{"w":"insipid","pos":"adj","def":"lacking flavour, interest or vigour","syn":["vapid","bland","banal"],"ant":["piquant","stimulating"],"sent":"The sequel was insipid where the original was sharp."}]},{"name":"Harmony and reconciliation","words":[{"w":"concord","pos":"n","def":"agreement or harmony between people or groups","syn":["accord","amity","consensus"],"ant":["discord","strife"],"sent":"Twenty years of concord ended in a single afternoon."},{"w":"amicable","pos":"adj","def":"characterised by friendliness and goodwill","syn":["cordial","congenial","harmonious"],"ant":["acrimonious","hostile"],"sent":"They reached an amicable settlement out of court."},{"w":"conciliatory","pos":"adj","def":"intended to placate or win goodwill","syn":["appeasing","propitiatory","peacemaking"],"ant":["antagonistic","provocative"],"sent":"A conciliatory statement followed within the hour."},{"w":"rapprochement","pos":"n","def":"the re-establishment of cordial relations","syn":["reconciliation","détente","understanding"],"ant":["estrangement","rupture"],"sent":"The visit signalled a rapprochement between the two states."}]},{"name":"Conflict and division","words":[{"w":"discord","pos":"n","def":"disagreement or lack of harmony","syn":["strife","dissension","friction"],"ant":["concord","amity"],"sent":"Discord over the budget split the committee."},{"w":"schism","pos":"n","def":"a split into opposing factions within a group","syn":["rift","rupture","cleavage"],"ant":["union","reconciliation"],"sent":"The schism has lasted four hundred years."},{"w":"dissent","pos":"n","def":"the holding or expression of opinions at variance with the official view","syn":["objection","disagreement","opposition"],"ant":["assent","acquiescence"],"sent":"A single note of dissent was recorded."},{"w":"contentious","pos":"adj","def":"likely to cause disagreement or argument","syn":["controversial","divisive","disputatious"],"ant":["uncontroversial","agreeable"],"sent":"The most contentious clause was quietly dropped."}]},{"name":"Beginning and growth","words":[{"w":"nascent","pos":"adj","def":"just coming into existence and beginning to develop","syn":["incipient","emerging","budding"],"ant":["mature","established"],"sent":"The nascent industry attracted more capital than sense."},{"w":"incipient","pos":"adj","def":"beginning to happen or develop","syn":["nascent","embryonic","inchoate"],"ant":["full-blown","developed"],"sent":"There were incipient signs of recovery by March."},{"w":"burgeon","pos":"v","def":"to begin to grow or increase rapidly","syn":["flourish","proliferate","mushroom"],"ant":["wane","atrophy"],"sent":"Demand burgeoned once the tariff was lifted."},{"w":"inchoate","pos":"adj","def":"just begun and so not fully formed","syn":["rudimentary","undeveloped","embryonic"],"ant":["complete","fully formed"],"sent":"His objection was real but inchoate."}]},{"name":"Appeasement of doubt and proof","words":[{"w":"corroborate","pos":"v","def":"to confirm or give support to a statement or finding","syn":["substantiate","verify","authenticate"],"ant":["refute","contradict"],"sent":"Two independent surveys corroborate the result."},{"w":"refute","pos":"v","def":"to prove a statement or theory to be wrong","syn":["disprove","rebut","confute"],"ant":["corroborate","substantiate"],"sent":"The paper refutes the earlier estimate convincingly."},{"w":"tenable","pos":"adj","def":"able to be defended against objection","syn":["defensible","sustainable","arguable"],"ant":["untenable","indefensible"],"sent":"That reading is no longer tenable."},{"w":"cogent","pos":"adj","def":"clear, logical and convincing","syn":["compelling","persuasive","forceful"],"ant":["specious","unconvincing"],"sent":"She made a cogent case for delay."},{"w":"equivocate","pos":"v","def":"to use ambiguous language so as to avoid committing oneself","syn":["prevaricate","hedge","waffle"],"ant":["specify","commit"],"sent":"He equivocated for twenty minutes and answered nothing."}]}];

<script>
const $ = (s,r=document)=>r.querySelector(s);
const app = $("#app");
const LET = ["A","B","C","D"];
const LS_KEY = "cat-vocab-trainer-v1";

/* ---------- flatten ---------- */
const ALL = [];
GROUPS.forEach((g,gi)=>g.words.forEach(w=>ALL.push(Object.assign({grp:g.name,gi},w))));
const byWord = {}; ALL.forEach(w=>byWord[w.w]=w);

/* ---------- persistence: which words you keep getting wrong ---------- */
function loadStore(){
  try{ return JSON.parse(localStorage.getItem(LS_KEY)) || {miss:{},seen:{}}; }
  catch(e){ return {miss:{},seen:{}}; }
}
function saveStore(s){ try{ localStorage.setItem(LS_KEY, JSON.stringify(s)); }catch(e){} }
let STORE = loadStore();
function markSeen(w,right){
  STORE.seen[w] = (STORE.seen[w]||0)+1;
  if(right){ if(STORE.miss[w]){ STORE.miss[w]--; if(STORE.miss[w]<=0) delete STORE.miss[w]; } }
  else STORE.miss[w] = (STORE.miss[w]||0)+1;
  saveStore(STORE);
}
const leechList = ()=>Object.keys(STORE.miss).filter(w=>byWord[w]);

/* ---------- helpers ---------- */
const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick = a=>a[Math.random()*a.length|0];
const cap = s=>s.charAt(0).toUpperCase()+s.slice(1);
const POS = {n:"noun",v:"verb",adj:"adjective",adv:"adverb"};

/* A distractor is safe only if it is not a synonym, antonym or the word itself. */
function related(w){
  const s = new Set([w.w.toLowerCase()]);
  w.syn.forEach(x=>s.add(x.toLowerCase()));
  w.ant.forEach(x=>s.add(x.toLowerCase()));
  return s;
}

/* ---------- question builders ---------- */
function qDefinition(w){
  const bad = shuffle(ALL.filter(o=>o.w!==w.w && o.gi!==w.gi)).slice(0,3).map(o=>o.def);
  const opts = shuffle([w.def, ...bad]);
  return {w, mode:"def",
    prompt:"Which of these is the meaning of",
    opts, ans:opts.indexOf(w.def)};
}
function qSynonym(w){
  const rel = related(w);
  const correct = pick(w.syn);
  /* one deliberate trap: an antonym of the same word */
  const trap = pick(w.ant);
  const pool = shuffle(ALL.filter(o=>o.gi!==w.gi))
    .flatMap(o=>o.syn)
    .filter(x=>!rel.has(x.toLowerCase()) && x.toLowerCase()!==trap.toLowerCase());
  const uniq = [];
  for(const x of pool){ if(!uniq.some(y=>y.toLowerCase()===x.toLowerCase())) uniq.push(x); if(uniq.length>=2) break; }
  const opts = shuffle([correct, trap, ...uniq]);
  return {w, mode:"syn", trap,
    prompt:"Which word is closest in meaning to",
    opts, ans:opts.indexOf(correct)};
}
function qAntonym(w){
  const rel = related(w);
  const correct = pick(w.ant);
  const trap = pick(w.syn);          /* trap: a synonym of the same word */
  const pool = shuffle(ALL.filter(o=>o.gi!==w.gi))
    .flatMap(o=>o.syn)
    .filter(x=>!rel.has(x.toLowerCase()) && x.toLowerCase()!==trap.toLowerCase());
  const uniq = [];
  for(const x of pool){ if(!uniq.some(y=>y.toLowerCase()===x.toLowerCase())) uniq.push(x); if(uniq.length>=2) break; }
  const opts = shuffle([correct, trap, ...uniq]);
  return {w, mode:"ant", trap,
    prompt:"Which word is most nearly OPPOSITE in meaning to",
    opts, ans:opts.indexOf(correct)};
}
const BUILD = {def:qDefinition, syn:qSynonym, ant:qAntonym};
const MODE_LABEL = {def:"Definition", syn:"Synonym", ant:"Antonym"};

/* ---------- session state ---------- */
let S = null;
let cfg = {mode:"def", len:20, group:"ALL"};

function wordPool(){
  if(cfg.group==="LEECH") return leechList().map(w=>byWord[w]);
  if(cfg.group==="ALL") return ALL.slice();
  return ALL.filter(w=>w.grp===cfg.group);
}

function startSession(){
  let pool = shuffle(wordPool());
  if(!pool.length){ renderHome("There is nothing in that list yet — answer a few questions first."); return; }
  const n = cfg.len==="ALL" ? pool.length : Math.min(cfg.len, pool.length);
  pool = pool.slice(0,n);
  S = {qs:pool.map(w=>{
        const m = cfg.mode==="mix" ? pick(["def","syn","ant"]) : cfg.mode;
        return BUILD[m](w);
      }),
      i:0, picked:[], right:0, t0:Date.now()};
  renderQ();
}

/* ---------- screens ---------- */
function renderHome(msg){
  S = null;
  const leech = leechList().length;
  const seen = Object.keys(STORE.seen).length;
  app.innerHTML = `
  <div class="wrap">
    <h1>Vocabulary Trainer</h1>
    <div class="sub">127 words in 28 meaning-groups · definition, synonym and antonym MCQs
      · your misses are remembered between sessions</div>

    ${msg?`<div class="note bad" style="margin-bottom:16px">${msg}</div>`:""}

    <div class="card">
      <div class="row" style="margin-bottom:14px">
        <label class="lbl">Mode</label>
        <div class="seg" id="segMode">
          <button data-v="def">Definition</button>
          <button data-v="syn">Synonym</button>
          <button data-v="ant">Antonym</button>
          <button data-v="mix">Mixed</button>
        </div>
      </div>
      <div class="row" style="margin-bottom:14px">
        <label class="lbl">Length</label>
        <div class="seg" id="segLen">
          <button data-v="10">10</button>
          <button data-v="20">20</button>
          <button data-v="40">40</button>
          <button data-v="ALL">All</button>
        </div>
      </div>
      <div class="row" style="margin-bottom:16px">
        <label class="lbl">Words</label>
        <div class="seg" id="segGrp">
          <button data-v="ALL">Everything</button>
          <button data-v="LEECH">My misses (${leech})</button>
        </div>
      </div>
      <button class="btn" id="go">Start</button>
      <button class="btn ghost" id="browse">Browse the list</button>
      ${seen?`<button class="btn ghost" id="reset">Reset my history</button>`:""}
    </div>

    <h2>Or drill one group</h2>
    <div class="grid">
      ${GROUPS.map(g=>`<button class="setbtn" data-grp="${g.name.replace(/"/g,'&quot;')}">
          <div class="k">${g.name}</div><div class="m">${g.words.length} words</div></button>`).join("")}
    </div>

    <div class="foot">
      Synonym questions always plant one antonym of the same word among the options, and antonym
      questions plant one synonym — because that is the trap the exam actually sets.
      Keyboard: <span class="kbd">1</span>–<span class="kbd">4</span> to answer,
      <span class="kbd">Enter</span> to continue.
    </div>
  </div>`;

  const seg = (id,key)=>{
    const el = $(id);
    [...el.children].forEach(b=>{
      if(String(cfg[key])===b.dataset.v) b.classList.add("on");
      b.onclick=()=>{ cfg[key] = b.dataset.v==="ALL"&&key==="len" ? "ALL"
                       : (key==="len" ? +b.dataset.v : b.dataset.v);
                      [...el.children].forEach(x=>x.classList.remove("on")); b.classList.add("on"); };
    });
  };
  seg("#segMode","mode"); seg("#segLen","len"); seg("#segGrp","group");
  $("#go").onclick = startSession;
  $("#browse").onclick = renderBrowse;
  if($("#reset")) $("#reset").onclick = ()=>{ STORE={miss:{},seen:{}}; saveStore(STORE); renderHome(); };
  document.querySelectorAll("[data-grp]").forEach(b=>{
    b.onclick=()=>{ cfg.group=b.dataset.grp; startSession(); };
  });
}

function renderQ(){
  const q = S.qs[S.i];
  const done = S.picked[S.i]!==undefined;
  const pct = Math.round(S.i/S.qs.length*100);
  app.innerHTML = `
  <div class="top"><div class="wrap">
    <div class="row" style="justify-content:space-between">
      <div class="row">
        <span class="pill">${MODE_LABEL[q.mode]}</span>
        <span class="pill">${S.i+1} / ${S.qs.length}</span>
      </div>
      <div class="row">
        <span class="pill good">✓ ${S.right}</span>
        <span class="pill bad">✕ ${S.picked.filter((p,i)=>p!==undefined&&p!==S.qs[i].ans).length}</span>
        <button class="btn ghost" id="quit">End</button>
      </div>
    </div>
    <div class="bar"><i style="width:${pct}%"></i></div>
  </div></div>

  <div class="wrap">
    <div class="card">
      <div class="qhead"><div class="qno">Question ${S.i+1}</div></div>
      <div class="prompt">${q.prompt}</div>
      <div class="word">${q.w.w}</div>
      <div class="pos">${POS[q.w.pos]}</div>
      <div id="opts">
        ${q.opts.map((o,i)=>`<div class="opt" data-i="${i}">
            <div class="lab">${LET[i]}</div><div>${q.mode==="def"?cap(o):o}</div></div>`).join("")}
      </div>
      <div id="fb"></div>
    </div>
    <div class="row" style="margin-top:14px">
      <button class="btn" id="next" ${done?"":"disabled"}>${S.i===S.qs.length-1?"See results":"Next"}</button>
      <span class="foot" style="margin:0"><span class="kbd">1</span>–<span class="kbd">4</span> answer · <span class="kbd">Enter</span> next</span>
    </div>
  </div>`;

  $("#quit").onclick = ()=>renderResults();
  $("#next").onclick = advance;
  document.querySelectorAll(".opt").forEach(el=>el.onclick=()=>choose(+el.dataset.i));
  if(done) reveal();
}

function choose(i){
  if(S.picked[S.i]!==undefined) return;
  S.picked[S.i]=i;
  const q=S.qs[S.i], right = i===q.ans;
  if(right) S.right++;
  markSeen(q.w.w, right);
  reveal();
  $("#next").disabled=false;
}

function reveal(){
  const q=S.qs[S.i], p=S.picked[S.i], right=p===q.ans;
  document.querySelectorAll(".opt").forEach((el,i)=>{
    el.classList.add("locked");
    if(i===q.ans) el.classList.add("correct");
    else if(i===p) el.classList.add("wrong");
  });
  let trapNote = "";
  if(!right && q.trap && q.opts[p]===q.trap)
    trapNote = q.mode==="syn"
      ? ` You picked <b>${q.trap}</b>, which is an <b>antonym</b> of ${q.w.w} — the classic trap.`
      : ` You picked <b>${q.trap}</b>, which is a <b>synonym</b> of ${q.w.w} — the classic trap.`;
  $("#fb").innerHTML = `
    <div class="note ${right?"good":"bad"}">
      <div class="defn"><b>${q.w.w}</b> <i>(${POS[q.w.pos]})</i> — ${q.w.def}.${trapNote}</div>
      <div class="sy"><b>Syn:</b> ${q.w.syn.join(", ")} &nbsp;·&nbsp; <b>Ant:</b> ${q.w.ant.join(", ")}</div>
      <div class="sy" style="margin-top:4px"><b>Group:</b> ${q.w.grp}</div>
      <div class="ex">“${q.w.sent}”</div>
    </div>`;
}

function advance(){
  if(S.i===S.qs.length-1) return renderResults();
  S.i++; renderQ();
}

function renderResults(){
  const attempted = S.picked.filter(p=>p!==undefined).length;
  const wrongIdx = S.qs.map((q,i)=>i).filter(i=>S.picked[i]!==undefined && S.picked[i]!==S.qs[i].ans);
  const secs = Math.round((Date.now()-S.t0)/1000);
  const acc = attempted?Math.round(S.right/attempted*100):0;
  app.innerHTML = `
  <div class="wrap">
    <h1>Session complete</h1>
    <div class="sub">${MODE_LABEL[cfg.mode]||"Mixed"} · ${cfg.group==="ALL"?"all words":cfg.group==="LEECH"?"my misses":cfg.group}</div>
    <div class="statgrid">
      <div class="stat"><div class="n">${S.right}/${attempted}</div><div class="l">Correct</div></div>
      <div class="stat"><div class="n">${acc}%</div><div class="l">Accuracy</div></div>
      <div class="stat"><div class="n">${Math.floor(secs/60)}m ${secs%60}s</div><div class="l">Time</div></div>
      <div class="stat"><div class="n">${leechList().length}</div><div class="l">Words still shaky</div></div>
    </div>

    ${wrongIdx.length?`
      <h2>Review — the ${wrongIdx.length} you missed</h2>
      <div class="card"><table>
        <tr><th>Word</th><th>Meaning</th><th>Synonyms</th><th>Antonyms</th></tr>
        ${wrongIdx.map(i=>{const w=S.qs[i].w;return `<tr>
          <td class="w">${w.w}</td><td>${cap(w.def)}</td>
          <td class="d">${w.syn.join(", ")}</td><td class="d">${w.ant.join(", ")}</td></tr>`;}).join("")}
      </table></div>`
    :`<div class="note good">Clean sweep — nothing missed in this session.</div>`}

    <div class="row" style="margin-top:20px">
      <button class="btn" id="again">Another session</button>
      ${leechList().length?`<button class="btn ghost" id="drill">Drill my misses</button>`:""}
      <button class="btn ghost" id="home">Home</button>
    </div>
  </div>`;
  $("#again").onclick = startSession;
  $("#home").onclick = ()=>renderHome();
  if($("#drill")) $("#drill").onclick = ()=>{ cfg.group="LEECH"; startSession(); };
}

function renderBrowse(){
  app.innerHTML = `
  <div class="wrap">
    <h1>Word list</h1>
    <div class="sub">127 words, grouped by meaning. Words you have missed are marked.</div>
    <button class="btn ghost" id="home" style="margin-bottom:18px">Back</button>
    ${GROUPS.map(g=>`
      <h2>${g.name}</h2>
      <div class="card"><table>
        <tr><th>Word</th><th>Meaning</th><th>Synonyms</th><th>Antonyms</th></tr>
        ${g.words.map(w=>`<tr>
          <td class="w">${w.w}${STORE.miss[w.w]?' <span class="pill bad" style="padding:1px 7px">×'+STORE.miss[w.w]+'</span>':''}</td>
          <td>${cap(w.def)}</td>
          <td class="d">${w.syn.join(", ")}</td>
          <td class="d">${w.ant.join(", ")}</td></tr>`).join("")}
      </table></div>`).join("")}
    <div class="row" style="margin-top:20px"><button class="btn" id="home2">Back</button></div>
  </div>`;
  $("#home").onclick = ()=>renderHome();
  $("#home2").onclick = ()=>renderHome();
}

/* ---------- keyboard ---------- */
document.addEventListener("keydown", e=>{
  if(!S) return;
  if(e.key>="1" && e.key<="4"){ const el=document.querySelector(`.opt[data-i="${+e.key-1}"]`); if(el) el.click(); }
  else if(e.key==="Enter"){ const b=$("#next"); if(b && !b.disabled) b.click(); }
});

renderHome();
</script>
</body>
</html>
