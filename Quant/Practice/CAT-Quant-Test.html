<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAT Quant — Interactive Practice Test</title>
<style>
:root{
  --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2b303b;
  --tx:#e6e8ec; --dim:#9aa2b1; --acc:#5b9cff; --ok:#3ecf8e; --bad:#ff6b6b;
  --warn:#f6c453; --mark:#a97bff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;}
.wrap{max-width:900px;margin:0 auto;padding:24px 18px 80px}
h1{font-size:24px;margin:0 0 4px} h2{font-size:17px;margin:26px 0 10px}
.sub{color:var(--dim);font-size:13px;margin-bottom:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.setbtn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;
  cursor:pointer;text-align:left;color:var(--tx);font:inherit;transition:.12s}
.setbtn:hover{border-color:var(--acc);transform:translateY(-1px)}
.setbtn .k{font-weight:640;font-size:14px} .setbtn .m{color:var(--dim);font-size:12px;margin-top:3px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--dim);padding:8px 14px;cursor:pointer;font:inherit}
.seg button.on{background:var(--acc);color:#0b0d11;font-weight:600}
.btn{background:var(--acc);color:#0b0d11;border:0;border-radius:9px;padding:10px 18px;
  font:inherit;font-weight:620;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line);font-weight:500}
.btn.ghost:hover{border-color:var(--acc)}
.btn:disabled{opacity:.4;cursor:default}
.hide{display:none!important}

/* topbar */
.top{position:sticky;top:0;z-index:5;background:rgba(15,17,21,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:10px 0;margin-bottom:18px}
.top .wrap{padding-top:0;padding-bottom:0}
.timer{font-variant-numeric:tabular-nums;font-weight:640;font-size:16px}
.timer.low{color:var(--bad)}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12px;color:var(--dim)}

/* question */
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.qno{font-size:12px;color:var(--dim);letter-spacing:.04em;text-transform:uppercase}
.qtext{font-size:17px;line-height:1.6;margin:6px 0 18px}
.opt{display:flex;gap:11px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:12px 14px;margin-bottom:9px;cursor:pointer;transition:.1s}
.opt:hover{border-color:#3c4557}
.opt.sel{border-color:var(--acc);background:#1b2434}
.opt.correct{border-color:var(--ok);background:#14291f}
.opt.wrong{border-color:var(--bad);background:#2b1919}
.opt .lab{width:22px;height:22px;flex:0 0 22px;border-radius:50%;border:1px solid var(--line);
  display:grid;place-items:center;font-size:12px;color:var(--dim)}
.opt.sel .lab{background:var(--acc);color:#0b0d11;border-color:var(--acc)}
.opt.correct .lab{background:var(--ok);color:#0b0d11;border-color:var(--ok)}
.opt.wrong .lab{background:var(--bad);color:#0b0d11;border-color:var(--bad)}
input[type=text]{background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--tx);
  padding:11px 13px;font:inherit;width:220px}
input[type=text]:focus{outline:0;border-color:var(--acc)}
.note{background:var(--panel2);border-left:3px solid var(--warn);border-radius:0 8px 8px 0;
  padding:11px 14px;margin-top:14px;font-size:14px;color:#dfe3ea}
.note.sol{border-left-color:var(--acc)}
.note.good{border-left-color:var(--ok)}
.note.bad{border-left-color:var(--bad)}
.note b{color:#fff}

/* palette */
.pal{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}
.pal button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);
  color:var(--dim);cursor:pointer;font:inherit;font-size:12px}
.pal button.cur{outline:2px solid var(--acc);outline-offset:1px;color:var(--tx)}
.pal button.ans{background:#1d3a2c;border-color:var(--ok);color:#bff0d8}
.pal button.mk{background:#2a2040;border-color:var(--mark);color:#dccdff}
.pal button.ok{background:#14291f;border-color:var(--ok);color:#7ee0b0}
.pal button.no{background:#2b1919;border-color:var(--bad);color:#ff9d9d}

/* results */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:14px 0 22px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:13px}
.stat .v{font-size:24px;font-weight:660} .stat .l{font-size:12px;color:var(--dim);margin-top:2px}
.rev{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;background:var(--panel)}
.rev.c{border-left:3px solid var(--ok)} .rev.w{border-left:3px solid var(--bad)} .rev.s{border-left:3px solid var(--dim)}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
.foot{position:fixed;bottom:0;left:0;right:0;background:rgba(15,17,21,.95);backdrop-filter:blur(8px);
  border-top:1px solid var(--line);padding:11px 0}
.foot .wrap{padding:0 18px;display:flex;gap:9px;align-items:center}
.sp{flex:1}
small.k{color:var(--dim);font-size:12px}
@media(max-width:600px){.qtext{font-size:16px}.wrap{padding:16px 12px 90px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
// Question bank — generated from Algebra-Practice.md, Means-and-Weighted-Averages-Practice.md,
// Mixtures-and-Alligation-Practice.md and Ratio-Proportion-Variation-Practice.md
// q: text, t: 'mcq'|'tita', o: options, a: correct index (mcq) or numeric answer (tita),
// alt: accepted alternate string answers, h: hint, s: solution
const BANK = {
/* == GENERATED TOPICS: do not edit by hand, see _build/gen_practice.py == */
  numbers: {
    name: "Number System",
    perQ: 90,
    sets: {
      A: { name: "Divisibility, factors and factorials", qs: [
        { id:"A1", t:"tita", q:"Find the number of factors of 720.", a:30,
          h:"§3 — factorise, then multiply (exponent + 1) across the primes.",
          s:"720 = 2⁴ × 3² × 5 ⟹ (4+1)(2+1)(1+1) = <b>30 factors</b>." },
        { id:"A2", t:"mcq", q:"The number of even factors of 360 is", o:["12","16","18","24"], a:2,
          h:"§3 — an even factor must take at least one 2, so the exponent of 2 has 3 choices, not 4.",
          s:"360 = 2³ × 3² × 5 ⟹ even factors = 3 × 3 × 2 = <b>18</b>. (Total 24, odd 6, and 24 − 6 = 18 ✓)" },
        { id:"A3", t:"tita", q:"Find the sum of all factors of 200.", a:465,
          h:"§3 — the sum of factors is the product of the geometric sums over each prime.",
          s:"200 = 2³ × 5² ⟹ (1+2+4+8)(1+5+25) = 15 × 31 = <b>465</b>." },
        { id:"A4", t:"mcq", q:"The largest 3-digit number divisible by both 8 and 12 is", o:["960","972","984","996"], a:2,
          h:"§4 — divisible by both means divisible by their LCM, which is 24, not 96.",
          s:"LCM(8, 12) = 24 ⟹ 999 ÷ 24 = 41 remainder 15 ⟹ 41 × 24 = <b>984</b>." },
        { id:"A5", t:"tita", q:"How many trailing zeroes does 100! have?", a:24,
          h:"§12 — count the 5s, not the 2s, and don't forget that 25, 50, 75 and 100 each contribute an extra one.",
          s:"⌊100/5⌋ + ⌊100/25⌋ = 20 + 4 = <b>24</b>." },
        { id:"A6", t:"mcq", q:"The number of factors of 1800 that are perfect squares is", o:["4","6","8","12"], a:2,
          h:"§10 — a perfect-square factor needs every exponent even, so count the even choices for each prime.",
          s:"1800 = 2³ × 3² × 5². Even exponents: 2 has {0,2}, 3 has {0,2}, 5 has {0,2} ⟹ 2 × 2 × 2 = <b>8</b>." }
      ]},
      B: { name: "HCF and LCM", qs: [
        { id:"B1", t:"tita", q:"Find the HCF of 108 and 144.", a:36,
          h:"§4 — take the lowest power of each shared prime.",
          s:"108 = 2²·3³ and 144 = 2⁴·3² ⟹ HCF = 2²·3² = <b>36</b>." },
        { id:"B2", t:"mcq", q:"The LCM of two numbers is 495 and their HCF is 5. If their sum is 100, the numbers are", o:["45 and 55","40 and 60","35 and 65","25 and 75"], a:0,
          h:"§4 — the product of the numbers is HCF × LCM. With the sum known, they are the roots of a quadratic.",
          s:"Product = 5 × 495 = 2475 with sum 100 ⟹ x² − 100x + 2475 = 0 ⟹ x = <b>45 and 55</b>. (Check: HCF 5, LCM 495 ✓ — the other options fail the HCF test.)" },
        { id:"B3", t:"tita", q:"Find the greatest number that divides 43, 91 and 183 leaving the same remainder in each case.", a:4,
          h:"§4 — if the remainder is equal but unknown, it cancels in the differences. Take the HCF of the differences.",
          s:"Differences 48, 92 and 140 ⟹ HCF = <b>4</b>. (Each of 43, 91, 183 leaves remainder 3 on division by 4 ✓)" },
        { id:"B4", t:"mcq", q:"The least number which, when divided by 5, 6, 7 and 8, leaves remainder 3 in each case is", o:["803","843","863","1683"], a:1,
          h:"§4 — a common remainder means LCM + remainder.",
          s:"LCM(5, 6, 7, 8) = 840 ⟹ answer = 840 + 3 = <b>843</b>." },
        { id:"B5", t:"tita", q:"Three bells toll at intervals of 9, 12 and 15 minutes. If they toll together at 9:00 a.m., after how many minutes do they next toll together?", a:180,
          h:"§4 — simultaneous events recur at the LCM of the intervals.",
          s:"LCM(9, 12, 15) = <b>180 minutes</b> (at noon)." },
        { id:"B6", t:"mcq", q:"The HCF of two numbers is 12 and their LCM is 336. If one number is 84, the other is", o:["24","48","56","72"], a:1,
          h:"§4 — HCF × LCM = product of the two numbers.",
          s:"12 × 336 / 84 = <b>48</b>. (Check: HCF(84, 48) = 12 ✓)" }
      ]},
      C: { name: "Unit digit and cyclicity", qs: [
        { id:"C1", t:"tita", q:"Find the unit digit of 7¹⁰⁵.", a:7,
          h:"§5 — 7 has a cycle of 4: 7, 9, 3, 1. Reduce the exponent modulo 4.",
          s:"105 mod 4 = 1 ⟹ the first entry of the cycle ⟹ unit digit <b>7</b>." },
        { id:"C2", t:"mcq", q:"The unit digit of 2⁶⁴ is", o:["2","4","6","8"], a:2,
          h:"§5 — cycle 2, 4, 8, 6. A remainder of 0 means the last entry, not the first.",
          s:"64 mod 4 = 0 ⟹ the fourth entry ⟹ unit digit <b>6</b>." },
        { id:"C3", t:"tita", q:"Find the unit digit of 13⁴⁷ × 17²³.", a:1,
          h:"§5 — only the unit digits 3 and 7 matter; handle each cycle separately, then multiply.",
          s:"3⁴⁷: 47 mod 4 = 3 ⟹ 7. 7²³: 23 mod 4 = 3 ⟹ 3. Then 7 × 3 = 21 ⟹ unit digit <b>1</b>." },
        { id:"C4", t:"mcq", q:"The unit digit of 1! + 2! + 3! + … + 100! is", o:["1","3","5","7"], a:1,
          h:"§12 — every factorial from 5! onward ends in 0, so only four terms matter.",
          s:"1 + 2 + 6 + 24 = 33 ⟹ unit digit <b>3</b>." },
        { id:"C5", t:"tita", q:"Find the unit digit of 4³⁷³.", a:4,
          h:"§5 — 4 has a cycle of length 2: odd powers end in 4, even powers in 6.",
          s:"373 is odd ⟹ unit digit <b>4</b>." }
      ]},
      D: { name: "Remainders", qs: [
        { id:"D1", t:"tita", q:"Find the remainder when 2⁵¹ is divided by 7.", a:1,
          h:"§6 — hunt for the small power ≡ 1. Here 2³ = 8 ≡ 1 (mod 7).",
          s:"2³ ≡ 1 (mod 7) and 51 = 3 × 17 ⟹ 2⁵¹ ≡ 1³⁷ ≡ <b>1</b>." },
        { id:"D2", t:"mcq", q:"The remainder when 15²³ is divided by 16 is", o:["1","7","14","15"], a:3,
          h:"§6 — write 15 as −1 modulo 16. An odd power keeps the sign.",
          s:"15 ≡ −1 ⟹ (−1)²³ = −1 ≡ <b>15</b> (mod 16)." },
        { id:"D3", t:"tita", q:"Find the remainder when 7¹⁰⁰ is divided by 100.", a:1,
          h:"§6 — 7⁴ = 2401 ends in 01.",
          s:"7⁴ ≡ 1 (mod 100) ⟹ 7¹⁰⁰ = (7⁴)²⁵ ≡ <b>1</b>." },
        { id:"D4", t:"mcq", q:"The remainder when 16! is divided by 17 is", o:["0","1","16","17"], a:2,
          h:"§6 — Wilson's theorem: (p − 1)! ≡ −1 (mod p) for a prime p.",
          s:"17 is prime ⟹ 16! ≡ −1 ≡ <b>16</b> (mod 17). (A remainder can never equal the divisor, which rules out option (d) instantly.)" },
        { id:"D5", t:"tita", q:"A number divided by 296 leaves remainder 75. What remainder does it leave when divided by 37?", a:1,
          h:"§6 — 296 is a multiple of 37, so that part vanishes and only the remainder needs reducing.",
          s:"296 = 8 × 37 ⟹ N = 296k + 75 ≡ 75 (mod 37), and 75 = 2(37) + 1 ⟹ remainder <b>1</b>." },
        { id:"D6", t:"mcq", q:"The remainder when 3⁵⁷ is divided by 8 is", o:["1","3","5","7"], a:1,
          h:"§6 — 3² = 9 ≡ 1 (mod 8), so only the parity of the exponent matters.",
          s:"3⁵⁷ = (3²)²⁸ × 3 ≡ 1 × 3 = <b>3</b>." }
      ]},
      E: { name: "Perfect squares, cubes and least multipliers", qs: [
        { id:"E1", t:"tita", q:"Find the least positive integer n such that 1176n is a perfect square.", a:6,
          h:"§10 — factorise, then supply exactly what is missing to make every exponent even.",
          s:"1176 = 2³ × 3 × 7². The 2 and the 3 have odd exponents ⟹ n = 2 × 3 = <b>6</b>. (1176 × 6 = 7056 = 84² ✓)" },
        { id:"E2", t:"mcq", q:"The least number by which 8232 must be divided to give a perfect cube is", o:["3","6","7","21"], a:0,
          h:"§10 — for a cube, every exponent must be a multiple of 3. Here you remove rather than add.",
          s:"8232 = 2³ × 3 × 7³ ⟹ divide by <b>3</b> to leave 2744 = 14³." },
        { id:"E3", t:"tita", q:"How many perfect squares lie strictly between 100 and 1000?", a:21,
          h:"§10 — find the first and last integer whose square lies in range, then count inclusively.",
          s:"11² = 121 through 31² = 961 ⟹ 31 − 11 + 1 = <b>21</b>. (100 = 10² and 1024 = 32² are both outside.)" },
        { id:"E4", t:"mcq", q:"The smallest number that must be added to 1780 to make it a perfect square is", o:["21","49","69","89"], a:2,
          h:"§10 — locate the nearest squares on either side: 42² and 43².",
          s:"42² = 1764 and 43² = 1849 ⟹ 1849 − 1780 = <b>69</b>." },
        { id:"E5", t:"tita", q:"Find the smallest positive integer by which 2925 must be multiplied to become a perfect square.", a:13,
          h:"§10 — factorise and look for the lone prime.",
          s:"2925 = 3² × 5² × 13 ⟹ multiply by <b>13</b> (giving 195²)." }
      ]},
      F: { name: "Integer solutions", qs: [
        { id:"F1", t:"tita", q:"How many solutions in positive integers does 3x + 5y = 100 have?", a:6,
          h:"§11 — reduce modulo the smaller coefficient to pin down y, then step by 3.",
          s:"5y ≡ 100 (mod 3) ⟹ 2y ≡ 1 ⟹ y ≡ 2 (mod 3) ⟹ y = 2, 5, 8, 11, 14, 17 ⟹ <b>6 solutions</b>. (y = 20 gives x = 0, which is not positive.)" },
        { id:"F2", t:"mcq", q:"The number of non-negative integer solutions of 2x + 3y = 30 is", o:["5","6","7","11"], a:1,
          h:"§11 — 3y must be even, so y must be even. Note that here 0 is allowed.",
          s:"y ∈ {0, 2, 4, 6, 8, 10} ⟹ <b>6 solutions</b>." },
        { id:"F3", t:"tita", q:"If x and y are positive integers satisfying 7x + 11y = 100, find x + y.", a:12,
          h:"§11 — reduce modulo 7 to fix y, then check that only one value stays in range.",
          s:"4y ≡ 2 (mod 7) ⟹ y ≡ 4 (mod 7). Only y = 4 keeps 11y below 100 ⟹ x = 8 ⟹ x + y = <b>12</b>." },
        { id:"F4", t:"mcq", q:"The number of solutions of x + y + z = 10 in positive integers is", o:["28","36","45","66"], a:1,
          h:"§11 — stars and bars: C(n − 1, r − 1) for positive solutions.",
          s:"C(9, 2) = <b>36</b>. (66 = C(12, 2) is the non-negative count — the planted decoy.)" },
        { id:"F5", t:"tita", q:"Pens cost ₹7 each and notebooks ₹9 each. A man spends exactly ₹62 and buys at least one of each. Find the number of notebooks.", a:3,
          h:"§11 — reduce modulo 7 to fix the number of notebooks; the range does the rest.",
          s:"2y ≡ 6 (mod 7) ⟹ y ≡ 3 (mod 7). y = 10 already exceeds ₹62 ⟹ y = <b>3 notebooks</b> (and 5 pens: 35 + 27 = 62 ✓)." }
      ]},
      M: { name: "Mixed Set — exam feel (15 minutes)", block: 900, qs: [
        { id:"M1", t:"tita", q:"Find the number of factors of 2520.", a:48,
          h:"Factorise first.",
          s:"2520 = 2³ × 3² × 5 × 7 ⟹ 4 × 3 × 2 × 2 = <b>48</b>." },
        { id:"M2", t:"mcq", q:"The unit digit of 3²⁰²⁰ is", o:["1","3","7","9"], a:0,
          h:"Cycle of 4; a remainder of 0 points to the last entry.",
          s:"2020 mod 4 = 0 ⟹ the fourth entry of 3, 9, 7, 1 ⟹ <b>1</b>." },
        { id:"M3", t:"tita", q:"Find the remainder when 5⁹⁹ is divided by 13.", a:8,
          h:"5⁴ ≡ 1 (mod 13).",
          s:"5⁴ = 625 = 48(13) + 1 ⟹ period 4. 99 mod 4 = 3 ⟹ 5³ = 125 ≡ <b>8</b> (mod 13)." },
        { id:"M4", t:"mcq", q:"The HCF of 391, 425 and 527 is", o:["13","17","19","23"], a:1,
          h:"All three are products of a common two-digit prime.",
          s:"391 = 17 × 23, 425 = 17 × 25, 527 = 17 × 31 ⟹ HCF = <b>17</b>." },
        { id:"M5", t:"tita", q:"How many zeroes are at the end of 50!?", a:12,
          h:"Count the 5s.",
          s:"⌊50/5⌋ + ⌊50/25⌋ = 10 + 2 = <b>12</b>." },
        { id:"M6", t:"mcq", q:"The least number which when divided by 12, 15 and 20 leaves remainders 5, 8 and 13 respectively is", o:["53","55","60","67"], a:0,
          h:"Each remainder falls short of its divisor by the same amount.",
          s:"12 − 5 = 15 − 8 = 20 − 13 = 7 ⟹ answer = LCM(12, 15, 20) − 7 = 60 − 7 = <b>53</b>." },
        { id:"M7", t:"tita", q:"Find the smallest positive integer n such that 720n is a perfect cube.", a:300,
          h:"Bring every exponent up to the next multiple of 3.",
          s:"720 = 2⁴ × 3² × 5 ⟹ needs 2² × 3 × 5² = <b>300</b>. (720 × 300 = 216000 = 60³ ✓)" },
        { id:"M8", t:"mcq", q:"The number of even factors of 2⁴ × 3³ × 5² is", o:["36","45","48","60"], a:2,
          h:"The exponent of 2 must be at least 1.",
          s:"4 × 4 × 3 = <b>48</b>. (Total 60 minus the 12 odd factors ✓)" },
        { id:"M9", t:"tita", q:"The sum of two numbers is 528 and their HCF is 33. How many such pairs of numbers exist?", a:4,
          h:"Write them as 33a and 33b with a and b coprime.",
          s:"a + b = 16 with gcd(a, b) = 1 ⟹ (1,15), (3,13), (5,11), (7,9) ⟹ <b>4 pairs</b>." },
        { id:"M10", t:"mcq", q:"The remainder when 32^(32^32) is divided by 7 is", o:["1","2","4","6"], a:2,
          h:"Reduce the base mod 7 first, then reduce the tower exponent mod the cycle length.",
          s:"32 ≡ 4 (mod 7), and 4 has cycle 4, 2, 1 of length 3. 32³² ≡ 2³² ≡ (−1)³² ≡ 1 (mod 3) ⟹ 4¹ = <b>4</b>." }
      ]}
    }
  },
  percentages: {
    name: "Percentages",
    perQ: 75,
    sets: {
      A: { name: "Fraction ↔ percentage fluency", qs: [
        { id:"A1", t:"tita", q:"Find 37.5% of 1,024.", a:384,
          h:"§2 — 37.5% is 3/8. Never long-multiply by 0.375.",
          s:"3/8 × 1024 = <b>384</b>." },
        { id:"A2", t:"mcq", q:"If 15% of a number is 45, then 40% of the same number is", o:["90","105","120","135"], a:2,
          h:"§1 — find the number first, or scale directly: 40/15 = 8/3.",
          s:"The number is 45/0.15 = 300 ⟹ 40% = <b>120</b>. Or 45 × (40/15) = 120." },
        { id:"A3", t:"tita", q:"What percentage of 250 is 45?", a:18,
          h:"§3 — \"of 250\" names the base. It goes in the denominator.",
          s:"45/250 × 100 = <b>18%</b>." },
        { id:"A4", t:"mcq", q:"62.5% of 800 equals", o:["480","500","520","560"], a:1,
          h:"§2 — 62.5% is 5/8.",
          s:"5/8 × 800 = <b>500</b>." },
        { id:"A5", t:"tita", q:"A number increased by 25% gives 350. Find the original number.", a:280,
          h:"§3 — divide by 1.25, don't subtract 25% of 350. The base is the original, not the result.",
          s:"350/1.25 = <b>280</b>. (Subtracting 25% of 350 gives 262.5 — the standard error.)" },
        { id:"A6", t:"mcq", q:"If A is 300 and B is 240, then B is less than A by", o:["20%","25%","30%","33.33%"], a:0,

          s:"60/300 = <b>20%</b>. (Dividing by 240 gives 25% — that would answer \"A is more than B by …\".)" }
      ]},
      B: { name: "The reciprocal relationship", qs: [
        { id:"B1", t:"mcq", q:"If A is 25% more than B, then B is less than A by", o:["20%","25%","16.67%","33.33%"], a:0,
          h:"§4 — 25% is 1/4 more, so the reverse is 1/5 less.",
          s:"A : B = 5 : 4 ⟹ B is short by 1 part out of 5 = <b>20%</b>." },

          s:"Loss fraction = 2ab/(a + b)² = 2(1)(3)/16 = 3/8 ⟹ 16000 × 3/8 = **<b>₹6,000</b>**." },
        { id:"E5", t:"tita", q:"x is partly constant and partly varies as y. When y = 10, x = 250; when y = 20, x = 400. Find x when y = 30.", a:550,
          h:"§8, partial variation — x = m + ny, and two data points give two equations.",
          s:"x = m + ny. m + 10n = 250 and m + 20n = 400 ⟹ 10n = 150 ⟹ n = 15, m = 100. At y = 30: x = 100 + 450 = **<b>550</b>**." },
        { id:"E6", t:"mcq", q:"If a ∝ b and b ∝ 1/c, then", o:["a ∝ c","a ∝ 1/c","a ∝ c²","no relation exists between a and c"], a:1,
          h:"§8 — chain the constants: a = k₁b and b = k₂/c.",
          s:"a = k₁b and b = k₂/c ⟹ a = k₁k₂/c, so **<b>a ∝ 1/c</b>**." }
      ]},
      F: { name: "Equal ratios & the k-theorem", qs: [
        { id:"F1", t:"tita", q:"If a/3 = b/4 = c/7, find (a + b + c)/c.", a:2,
          h:"§9 — set the common value to k and write a, b, c in terms of k.",
          s:"a = 3k, b = 4k, c = 7k ⟹ (14k)/(7k) = **<b>2</b>**." },
        { id:"F2", t:"mcq", q:"If x : y : z = 2 : 3 : 5, then (x² + y² + z²)/(xy + yz + zx) equals", o:["31/38","19/16","38/31","2"], a:2,
          h:"§9 — numerator and denominator are both homogeneous of degree 2, so every k² cancels.",
          s:"With x = 2k, y = 3k, z = 5k: numerator = 38k², denominator = 6k² + 15k² + 10k² = 31k² ⟹ **<b>38/31</b>**." },
        { id:"F3", t:"tita", q:"If a : b = 3 : 5 and b : c = 2 : 3, find (a + c)/b.", a:2.1, alt:["21/10"],
          h:"§3 to build a : b : c, then §9 to evaluate.",
          s:"LCM on b: a : b = 6 : 10 and b : c = 10 : 15 ⟹ a : b : c = 6 : 10 : 15. (a + c)/b = 21/10 = **<b>2.1</b>**." },
        { id:"F4", t:"mcq", q:"If a/2 = b/3 = c/4, then (3a + 2b + c)/(a + b + c) equals", o:["9/16","4/3","16/9","2"], a:2,
          h:"§9 — substitute a = 2k, b = 3k, c = 4k and cancel k.",
          s:"a = 2k, b = 3k, c = 4k ⟹ (6k + 6k + 4k)/(9k) = **<b>16/9</b>**." },
        { id:"F5", t:"tita", q:"Three numbers are in the ratio 3 : 4 : 5 and the sum of their squares is 1250. Find the largest number.", a:25,
          h:"§1 — write them as 3k, 4k, 5k. The equation becomes a single one in k².",
          s:"9k² + 16k² + 25k² = 50k² = 1250 ⟹ k² = 25 ⟹ k = 5 ⟹ numbers 15, 20, **<b>25</b>**." }
      ]},
      G: { name: "Redistribution, exchange & savings", qs: [
        { id:"G1", t:"tita", q:"A and B have money in the ratio 4 : 3. If A gives ₹50 to B, the ratio becomes 6 : 5. Find A's original amount (in ₹).", a:1100,
          h:"§12 — what A loses, B gains. Check afterwards that the total is unchanged.",
          s:"(4k − 50)/(3k + 50) = 6/5 ⟹ 20k − 250 = 18k + 300 ⟹ k = 275 ⟹ A = **<b>₹1,100</b>**, B = ₹825. Conservation check: 1100 + 825 = 1925 and 1050 + 875 = 1925 ✓, and 1050 : 875 = 6 : 5 ✓." },
        { id:"G2", t:"mcq", q:"The salaries of A and B are in the ratio 5 : 4. A's salary rises by 15% and B's rises by ₹1,000, after which the ratio is 23 : 20. B's new salary is", o:["₹4,600","₹5,000","₹5,750","₹4,000"], a:1,
          h:"§12, second worked example — this is an increase, not a transfer, so the total is not conserved. Answer the question actually asked: the **new** salary.",
          s:"5.75k/(4k + 1000) = 23/20 ⟹ 115k = 92k + 23000 ⟹ k = 1000. Original: A = ₹5,000, B = ₹4,000. New: A = ₹5,750, B = **<b>₹5,000</b>**. (₹4,000 is B's *old* salary — the trap.) No conservation check here: an increase changes the total." },
        { id:"G3", t:"tita", q:"A, B and C have amounts in the ratio 3 : 4 : 5. A gives ₹50 to B, and B gives ₹100 to C. The final ratio becomes 2 : 3 : 7. Find the total amount (in ₹).", a:600,
          h:"§12, three-way transfer — B both receives and gives, so write both movements. Use the third comparison as a free check.",
          s:"After: A = 3k − 50, B = 4k + 50 − 100 = 4k − 50, C = 5k + 100. From A : B = 2 : 3: 3(3k − 50) = 2(4k − 50) ⟹ 9k − 150 = 8k − 100 ⟹ k = 50. Amounts 100, 150, 350 ⟹ total = **<b>₹600</b>** = 12k ✓. Free check with the unused pair: B : C = 150 : 350 = 3 : 7 ✓." },
        { id:"G4", t:"mcq", q:"The savings of A and B are in the ratio 7 : 5. A spends ₹1,000 and B spends ₹800, after which the ratio becomes 2 : 1. B's original savings were", o:["₹800","₹1,000","₹1,200","₹1,400"], a:1,
          h:"§12 — different amounts are removed, so this is not conservation; set up one equation in k.",
          s:"(7k − 1000)/(5k − 800) = 2/1 ⟹ 7k − 1000 = 10k − 1600 ⟹ 3k = 600 ⟹ k = 200. A = ₹1,400, B = **<b>₹1,000</b>**. Check: 400 : 200 = 2 : 1 ✓." },
        { id:"G5", t:"tita", q:"The incomes of A and B are in the ratio 5 : 4 and their expenditures in the ratio 3 : 2. If each saves ₹6,000, find A's income (in ₹).", a:15000,
          h:"§12 — two independent ratios means two variables, x and y, not one k. Income − expenditure = savings gives two equations.",
          s:"Incomes 5x, 4x; expenditures 3y, 2y. 5x − 3y = 6000 and 4x − 2y = 6000 ⟹ from the second, y = 2x − 3000. Substituting: 5x − 6x + 9000 = 6000 ⟹ x = 3000 ⟹ A's income = **<b>₹15,000</b>**. Check: incomes 15000 and 12000, expenditures 9000 and 6000, savings 6000 each ✓." },
        { id:"G6", t:"mcq", q:"A bag contains ₹1, 50-paise and 25-paise coins in the ratio 5 : 6 : 8, totalling ₹210. The number of 25-paise coins is", o:["105","126","168","210"], a:2,
          h:"§1 and the Traps table — the ratio is of the **number** of coins, so convert each count into value before summing.",
          s:"Counts 5k, 6k, 8k ⟹ value = 5k + 3k + 2k = 10k rupees = 210 ⟹ k = 21. 25-paise coins = 8 × 21 = **<b>168</b>**. (Treating 5 : 6 : 8 as a ratio of values is the trap.)" }
      ]},
      M: { name: "Mixed Set — Mixed Set — exam feel", block: 900, qs: [
        { id:"M1", t:"mcq", q:"₹8,500 is divided among A, B and C such that A : B = 3 : 4 and B : C = 2 : 5. C's share is", o:["₹1,500","₹2,000","₹5,000","₹3,500"], a:2,
          h:"Equalise B with the LCM before splitting.",
          s:"LCM on B: A : B = 3 : 4 and B : C = 4 : 10 ⟹ A : B : C = 3 : 4 : 10, sum 17. Each part = 8500/17 = 500 ⟹ C = **<b>₹5,000</b>**." },
        { id:"M2", t:"tita", q:"If (5x − 3y)/(5x + 3y) = 1/3, find x/y.", a:1.2, alt:["6/5"],
          h:"Invert first, then apply reverse componendo–dividendo.",
          s:"(a − b)/(a + b) = 1/3 ⟹ (a + b)/(a − b) = 3 ⟹ a/b = (3 + 1)/(3 − 1) = 2. With a = 5x, b = 3y: 5x/3y = 2 ⟹ x/y = 6/5 = **<b>1.2</b>**." },
        { id:"M3", t:"mcq", q:"Two numbers are in the ratio 5 : 8. If each is increased by 9, the ratio becomes 8 : 11. The smaller number is", o:["15","20","24","30"], a:0,
          h:"One k, cross-multiply.",
          s:"(5k + 9)/(8k + 9) = 8/11 ⟹ 55k + 99 = 64k + 72 ⟹ 9k = 27 ⟹ k = 3 ⟹ numbers **<b>15</b>** and 24. Check: 24 : 33 = 8 : 11 ✓." },
        { id:"M4", t:"tita", q:"The cost of a stone varies as the square of its weight. A stone worth ₹5,000 breaks into two pieces whose weights are in the ratio 3 : 2. Find the loss (in ₹).", a:2400,
          h:"Loss fraction = 2ab/(a + b)².",
          s:"Loss fraction = 2(3)(2)/(5)² = 12/25 ⟹ 5000 × 12/25 = **<b>₹2,400</b>**." },
        { id:"M5", t:"mcq", q:"A, B and C invest ₹8,000, ₹10,000 and ₹12,000 for 6, 8 and 10 months respectively. Out of a profit of ₹15,500, B's share is", o:["₹3,000","₹5,000","₹4,500","₹7,500"], a:1,
          h:"Capital × time, then reduce.",
          s:"Ratio = 8×6 : 10×8 : 12×10 = 48 : 80 : 120 = 6 : 10 : 15, sum 31. Each part = 15500/31 = 500 ⟹ B = **<b>₹5,000</b>**." },
        { id:"M6", t:"tita", q:"Three numbers are in the ratio 1 : 2 : 3 and the sum of their squares is 504. Find the sum of the numbers.", a:36,
          h:"14k² = 504. Then answer the sum, not k.",
          s:"k² + 4k² + 9k² = 14k² = 504 ⟹ k² = 36 ⟹ k = 6 ⟹ numbers 6, 12, 18, sum = **<b>36</b>**." },
        { id:"M7", t:"mcq", q:"A and B have money in the ratio 3 : 2. If A gives ₹100 to B, both have equal amounts. B originally had", o:["₹300","₹400","₹500","₹600"], a:1,
          h:"A transfer conserves the total, so each ends with half of 5k.",
          s:"Total = 5k, so each ends with 2.5k. 3k − 100 = 2.5k ⟹ k = 200 ⟹ A = ₹600, B = **<b>₹400</b>**. Check: 500 and 500 ✓." },
        { id:"M8", t:"tita", q:"x varies inversely as the square of y. When y = 3, x = 8. Find x when y = 6.", a:2,
          h:"xy² = k.",
          s:"xy² = k = 8 × 9 = 72 ⟹ x = 72/36 = **<b>2</b>**." },
        { id:"M9", t:"mcq", q:"₹1,800 is divided among three people in the inverse ratio 3 : 4 : 6. The largest share is", o:["₹400","₹600","₹800","₹900"], a:2,
          h:"Reciprocals, cleared by the LCM.",
          s:"Inverse ratio: 1/3 : 1/4 : 1/6 = 4 : 3 : 2 (×12), sum 9. Each part = 200 ⟹ shares **<b>₹800</b>**, ₹600, ₹400." },
        { id:"M10", t:"tita", q:"The incomes of two persons are in the ratio 9 : 7 and their expenditures in the ratio 4 : 3. If each saves ₹2,000, find the income of the first person (in ₹).", a:18000,
          h:"Two ratios, two variables. Eliminate the expenditure variable.",
          s:"9x − 4y = 2000 and 7x − 3y = 2000. Multiply the first by 3 and the second by 4: 27x − 12y = 6000 and 28x − 12y = 8000 ⟹ x = 2000 ⟹ first income = **<b>₹18,000</b>**. Check: incomes 18000 and 14000, expenditures 16000 and 12000, savings 2000 each ✓." }
      ]}
    }
  },
  averages: {
    name: "Means & Weighted Averages",
    perQ: 90,
    sets: {
      A: { name: "Core: sums, deviations, properties", qs: [
        { id:"A1", t:"tita", q:"Find the average of 102, 107, 99, 104, 98.", a:102,
          h:"§1, deviation method — take A = 100 and average the deviations.",
          s:"Take A = 100. Deviations: +2, +7, −1, +4, −2, summing to 10. Average = 100 + 10/5 = <b>102</b>." },

          h:"§2, the two transformation properties. Apply them in the stated order.",
          s:"Adding 4 raises the average to 31; doubling then doubles it to <b>62</b>." },
        { id:"A3", t:"tita", q:"The average of 11 consecutive integers is 17. Find the largest of them.", a:22,
          h:"§2, last bullet — for an AP the average is the middle term.",
          s:"For 11 consecutive integers the average is the 6th (middle) term, so the middle is 17. The numbers run 12 to 22; largest = <b>22</b>." },
        { id:"A4", t:"tita", q:"The average of five distinct positive integers is 10. What is the largest possible value of any one of them?", a:40,
          h:"§1, Sum = Average × Count. To push one value up, make the other four as small as they are allowed to be — and note \"distinct\".",
          s:"Total = 5 × 10 = 50. To maximise one value, minimise the other four distinct positive integers: 1 + 2 + 3 + 4 = 10. Largest = 50 − 10 = <b>40</b>." },
        { id:"A5", t:"mcq", q:"The average of 20 numbers is 45. If the average of the first 12 of them is 42, the average of the remaining 8 is", o:["48","49.5","51","52.5"], a:1,
          h:"§13, the two-line method — convert both averages to sums, subtract, divide once.",
          s:"Total = 900. First twelve sum to 504, so the rest sum to 396. Average = 396/8 = <b>49.5</b>." }
      ]},
      B: { name: "Weighted average & alligation", qs: [
        { id:"B1", t:"tita", q:"In a class, 30 boys average 55 marks and 20 girls average 70 marks. Find the class average.", a:61,
          h:"§3, the central formula. Then run the §3 sanity check — the answer must lie closer to 55.",
          s:"(30 × 55 + 20 × 70)/50 = (1650 + 1400)/50 = 61. Check: <b>61</b> is nearer 55 than 70, and boys are the larger group ✓." },
        { id:"B2", t:"mcq", q:"A shopkeeper sells 40 kg of rice at ₹25/kg and 60 kg at ₹35/kg. The average selling price per kg is", o:["₹30","₹30.50","₹31","₹32"], a:2,
          h:"§3 — the two quantities are unequal, so a plain mean of 25 and 35 is wrong.",
          s:"(40 × 25 + 60 × 35)/100 = (1000 + 2100)/100 = <b>31</b>. (Nearer 35, because more rice was sold at 35 ✓.)" },
        { id:"B3", t:"tita", q:"In a class of 60 students, boys average 62 marks and girls average 74 marks, while the class averages 71. Find the number of boys.", a:15,
          h:"§4, the backward direction — use alligation to get the boys : girls ratio first.",
          s:"Alligation about 71: boys : girls = (74 − 71) : (71 − 62) = 3 : 9 = 1 : 3. Of 60 students, boys = 60 × 1/4 = <b>15</b>." },
        { id:"B4", t:"mcq", q:"In a company, 40% of the employees are women. Men average ₹50,000 and women average ₹60,000 per month. The company average is", o:["₹53,000","₹54,000","₹55,000","₹56,000"], a:1,
          h:"§3 — the percentages are the weights. You do not need the actual head count.",
          s:"Weights 60 : 40. (60 × 50 + 40 × 60)/100 = (3000 + 2400)/100 = 54 thousand." },
        { id:"B5", t:"tita", q:"Sections A, B and C have 25, 35 and 40 students averaging 70, 65 and 60 marks respectively. Find the overall average.", a:64.25,
          h:"§3 extended to three groups, or §13's master relation Total = Σ(size × average).",
          s:"(25 × 70 + 35 × 65 + 40 × 60)/100 = (1750 + 2275 + 2400)/100 = 6425/100 = <b>64.25</b>." }
      ]},
      C: { name: "Replacement & addition", qs: [
        { id:"C1", t:"tita", q:"The average weight of 10 people increases by 1.5 kg when a new person replaces one weighing 58 kg. Find the weight (in kg) of the new person.", a:73,
          h:"§5, the general rule — new value = old value + (n × change in average).",
          s:"Total increase = 10 × 1.5 = 15 kg. New person = 58 + 15 = 73." },
        { id:"C2", t:"mcq", q:"The average of 12 numbers is 25. When one number is removed, the average of the rest is 24. The removed number is", o:["13","25","34","36"], a:3,
          h:"§5 — work with totals: 12 × 25 minus 11 × 24.",
          s:"12 × 25 − 11 × 24 = 300 − 264 = <b>36</b>." },
        { id:"C3", t:"tita", q:"The average age of 15 students is 14 years. When the teacher's age is included, the average becomes 15 years. Find the teacher's age.", a:30,
          h:"§5, the adding variant — new member's value = (n+1)A′ − nA. It is not 15.",
          s:"16 × 15 − 15 × 14 = 240 − 210 = 30. (Not 15 — the teacher must also pull the other fifteen up.)" },
        { id:"C4", t:"mcq", q:"The average score of 11 players is 32. The captain, who scored 50, leaves and a new player joins; the average becomes 31. The new player's score is", o:["28","39","41","43"], a:1,
          h:"§5 — total before, total after, and the 50 that left. Three sums, one subtraction.",
          s:"Original total = 352. After the swap the total is 11 × 31 = 341. Without the captain the other ten total 352 − 50 = 302, so the new player scored 341 − 302 = <b>39</b>." },
        { id:"C5", t:"tita", q:"In a group of 8 people, two members weighing 55 kg and 60 kg are replaced by two new members, and the average weight rises by 3 kg. Find the combined weight (in kg) of the two new members.", a:139,
          h:"§5 — the total change is still n × (change in average), regardless of how many members were swapped.",
          s:"Total increase = 8 × 3 = 24 kg. Combined new weight = (55 + 60) + 24 = 139." }
      ]},
      D: { name: "Correction problems", qs: [
        { id:"D1", t:"tita", q:"The average of 25 numbers was computed as 40, but one number was read as 36 instead of 63. Find the correct average.", a:41.08,
          h:"§6 — adjust the sum by the error first, then divide once.",
          s:"The sum was understated by 63 − 36 = 27. Correct average = 40 + 27/25 = 40 + 1.08 = <b>41.08</b>." },
        { id:"D2", t:"tita", q:"The average of 10 numbers is 62. It is later found that 85 was read as 58, and 45 was read as 54. Find the correct average.", a:63.8,
          h:"§6 — the two errors go in opposite directions. Compute the net correction to the sum.",
          s:"Errors: 85 − 58 = +27 and 45 − 54 = −9, net +18. Correct average = 62 + 18/10 = <b>63.8</b>." },
        { id:"D3", t:"mcq", q:"The average marks of 50 students was found to be 72. It was then discovered that two students' marks were entered as 48 and 55 instead of the correct 84 and 45. The correct average is", o:["71.48","72.48","72.52","73.52"], a:2,
          h:"§6 — net error = (84 − 48) + (45 − 55). Watch the sign of the second one.",
          s:"Net error = (84 − 48) + (45 − 55) = 36 − 10 = +26. Correct average = 72 + 26/50 = <b>72.52</b>." }
      ]},
      E: { name: "Average speed", qs: [
        { id:"E1", t:"tita", q:"A car travels from A to B at 30 km/h and returns at 70 km/h. Find the average speed (in km/h) for the whole journey.", a:42,
          h:"§7, equal distances ⟹ harmonic mean 2ab/(a+b). It is not 50.",
          s:"Equal distances ⟹ 2(30)(70)/(30 + 70) = 4200/100 = 42." },
        { id:"E2", t:"mcq", q:"A man cycles at 12 km/h for 3 hours and then at 18 km/h for 3 hours. His average speed is", o:["14 km/h","14.4 km/h","15 km/h","16 km/h"], a:2,
          h:"§7 — read for whether time or distance is equal. Here it is time.",

        { id:"E3", t:"tita", q:"A man covers three equal stretches of a road at 20 km/h, 30 km/h and 60 km/h. Find his average speed (in km/h).", a:30,

        { id:"E4", t:"tita", q:"A person travels 60 km at 30 km/h and the next 90 km at 45 km/h. Find the average speed (in km/h).", a:37.5,

        { id:"F2", t:"tita", q:"Two positive numbers have a sum of 30. Find their maximum possible product.", a:225,

        { id:"F3", t:"tita", q:"The AM of two positive numbers is 13 and their GM is 12. Find the positive difference between the two numbers.", a:10,

        { id:"F4", t:"mcq", q:"A quantity grows by 25% in the first year and by 80% in the second. The average annual growth rate is", o:["45%","50%","52.5%","55%"], a:1,

        { id:"F5", t:"tita", q:"For positive reals a and b, find the minimum value of (a + b)(1/a + 1/b).", a:4,

          s:"Expand: (a + b)(1/a + 1/b) = 2 + a/b + b/a ≥ 2 + 2 = <b>4</b>, with equality at a = b." }
      ]},
      G: { name: "AP-type averages, median, mode", qs: [
        { id:"G1", t:"tita", q:"Find the average of the first 75 natural numbers.", a:38,

          s:"(n + 1)/2 = 76/2 = <b>38</b>." },
        { id:"G2", t:"mcq", q:"The average of the first 20 odd natural numbers is", o:["19","20","21","40"], a:1,

          s:"Sum of the first 20 odd numbers = 20² = 400; average = 400/20 = <b>20</b>." },
        { id:"G3", t:"tita", q:"The average of the first n even natural numbers is 31. Find n.", a:30,

      H: { name: "Unknown counts & sub-groups", qs: [

        { id:"H2", t:"tita", q:"The average age of a group is 25 years. When 6 people of average age 32 join, the group's average becomes 27. Find the original number of people.", a:15,

        { id:"E5", t:"tita", q:"The probability that A solves a problem is 1/3 and that B solves it is 1/4. Find the probability that the problem is solved (as a fraction).", a:1/2, alt:["1/2"],
          h:"§14 — the complement of \"neither solves it\". Adding 1/3 and 1/4 double-counts the overlap.",
          s:"1 − (2/3)(3/4) = 1 − 1/2 = <b>1/2</b>." },
        { id:"E6", t:"mcq", q:"Three fair coins are tossed. Given that at least one shows heads, the probability that all three are heads is", o:["1/8","1/7","3/8","1/2"], a:1,
          h:"§15 — conditioning shrinks the sample space from 8 outcomes to 7.",
          s:"(1/8)/(7/8) = <b>1/7</b>." }
      ]},
      M: { name: "Mixed Set — exam feel (17 minutes)", block: 1020, qs: [
        { id:"M1", t:"tita", q:"Find the number of distinct arrangements of the letters of SUCCESS.", a:420,
          h:"Three S's and two C's.",
          s:"7!/(3! 2!) = 5040/12 = <b>420</b>." },
        { id:"M2", t:"mcq", q:"The number of diagonals of a polygon with 12 sides is", o:["44","54","60","66"], a:1,
          h:"¹²C₂ counts all the segments; subtract the 12 sides.",
          s:"66 − 12 = <b>54</b>." },
        { id:"M3", t:"tita", q:"In how many ways can 5 distinct letters be posted into 3 letter boxes?", a:243,
          h:"Each letter independently picks a box.",
          s:"3⁵ = <b>243</b>. (5³ answers a different question — boxes picking letters.)" },
        { id:"M4", t:"mcq", q:"The number of handshakes among 15 people, each shaking hands once with every other, is", o:["90","105","210","225"], a:1,
          h:"¹⁵C₂ — a handshake is unordered.",
          s:"15 × 14/2 = <b>105</b>." },
        { id:"M5", t:"tita", q:"In how many ways can 4 identical balls be placed in 3 distinct boxes?", a:15,
          h:"Stars and bars: C(n + r − 1, r − 1) for identical objects.",
          s:"⁶C₂ = <b>15</b>." },
        { id:"M6", t:"mcq", q:"A number is chosen at random from 1 to 100. The probability that it is divisible by 3 or 5 is", o:["47/100","1/2","53/100","8/15"], a:0,
          h:"Inclusion–exclusion: subtract the multiples of 15.",
          s:"33 + 20 − 6 = 47 ⟹ <b>47/100</b>." },
        { id:"M7", t:"tita", q:"In how many ways can a person go from the bottom-left to the top-right corner of a 4 × 3 grid, moving only right or up?", a:35,
          h:"Choose which of the 7 moves are the 3 upward ones.",
          s:"⁷C₃ = <b>35</b>." },
        { id:"M8", t:"mcq", q:"The rank of the word RANK among all arrangements of its letters in dictionary order is", o:["18","19","20","21"], a:2,
          h:"Count everything alphabetically before it, letter position by letter position.",
          s:"Words starting A, K or N: 3 × 3! = 18. Then RAKN is 19th and RANK is <b>20th</b>." },
        { id:"M9", t:"tita", q:"Five letters are placed at random into five addressed envelopes. In how many ways does no letter reach its correct envelope?", a:44,
          h:"§10 — this is the derangement D₅.",
          s:"D₅ = 5!(1 − 1 + ½ − 1/6 + 1/24 − 1/120) = <b>44</b>." },
        { id:"M10", t:"mcq", q:"Two dice are thrown. The probability that the product of the numbers is even is", o:["1/2","2/3","3/4","5/6"], a:2,
          h:"The complement: an odd product needs both dice odd.",
          s:"1 − (3/6)(3/6) = 1 − 1/4 = <b>3/4</b>." }
      ]}
    }
  }
/* == END GENERATED TOPICS == */
};

</script>
<script>
const $ = (s,r=document)=>r.querySelector(s);
const app = $("#app");
const LET = ["a","b","c","d","e"];
let S = null; // session state
let mode = "practice"; // or exam
let timerId = null;

/* ---------- answer checking ---------- */
function parseNum(str){
  if(str==null) return NaN;
  let s = String(str).trim().replace(/[₹,\s]/g,"").replace(/kmph|km\/h|kg|yrs?|years?|rs\.?/gi,"");
  if(s==="") return NaN;
  const f = s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);
  if(f) return parseFloat(f[1])/parseFloat(f[2]);
  const n = parseFloat(s);
  return isNaN(n)?NaN:n;
}
function isRight(q, val){
  if(val===undefined||val===null||val==="") return false;
  if(q.t==="mcq") return val===q.a;
  const s = String(val).trim();
  if(q.alt && q.alt.some(a=>a.replace(/[\s,]/g,"").toLowerCase()===s.replace(/[\s,]/g,"").toLowerCase())) return true;
  const n = parseNum(s);
  if(isNaN(n)) return false;
  const tol = Math.max(0.011, Math.abs(q.a)*0.001);
  return Math.abs(n-q.a)<=tol;
}
function fmtAns(q){
  if(q.t==="mcq") return "("+LET[q.a]+") "+q.o[q.a];
  if(q.alt&&q.alt.length) return q.alt[0];
  return String(q.a);
}
function mmss(t){const m=Math.floor(Math.abs(t)/60),s=Math.abs(t)%60;
  return (t<0?"-":"")+m+":"+String(s).padStart(2,"0");}

/* ---------- home ---------- */
function home(){
  clearInterval(timerId);
  let h = `<div class="wrap">
    <h1>CAT Quant — Interactive Practice</h1>
    <div class="sub">Built from your Algebra, Means &amp; Weighted Averages, and Mixtures &amp; Alligation practice sets. 129 questions.</div>
    <div class="card">
      <div class="row" style="margin-bottom:4px">
        <strong style="font-size:14px">Mode</strong>
        <div class="seg" id="modeseg">
          <button data-m="practice" class="${mode==='practice'?'on':''}">Practice</button>
          <button data-m="exam" class="${mode==='exam'?'on':''}">Exam</button>
        </div>
        <small class="k" id="modehelp"></small>
      </div>
    </div>`;
  for(const tk in BANK){
    const T = BANK[tk];
    const all = Object.keys(T.sets).reduce((n,k)=>n+T.sets[k].qs.length,0);
    h += `<h2>${T.name}</h2><div class="grid">`;
    h += `<button class="setbtn" data-t="${tk}" data-s="ALL"><div class="k">▶ Full topic test</div>
           <div class="m">${all} questions · ${Math.round(all*T.perQ/60)} min</div></button>`;
    for(const sk in T.sets){
      const st = T.sets[sk], n = st.qs.length;
      const secs = st.block || n*T.perQ;
      h += `<button class="setbtn" data-t="${tk}" data-s="${sk}"><div class="k">Set ${sk} — ${st.name}</div>
             <div class="m">${n} questions · ${Math.round(secs/60)} min</div></button>`;
    }
    h += `</div>`;
  }
  const grand = Object.keys(BANK).reduce((n,tk)=>n+Object.keys(BANK[tk].sets).reduce((m,k)=>m+BANK[tk].sets[k].qs.length,0),0);
  h += `<h2>Everything</h2><div class="grid">
    <button class="setbtn" data-t="ALL" data-s="ALL"><div class="k">▶ Full mock — all topics</div>
    <div class="m">${grand} questions · shuffled · ~150 min</div></button>
    <button class="setbtn" data-t="ALL" data-s="MIX"><div class="k">▶ Mixed sets only</div>
    <div class="m">16 questions · 30 min · exam feel</div></button>
   </div></div>`;
  app.innerHTML = h;
  updModeHelp();
  $("#modeseg").onclick = e=>{const b=e.target.closest("button"); if(!b)return;
    mode=b.dataset.m; [...e.currentTarget.children].forEach(c=>c.classList.toggle("on",c===b)); updModeHelp();};
  app.querySelectorAll(".setbtn").forEach(b=>b.onclick=()=>start(b.dataset.t,b.dataset.s));
}
function updModeHelp(){
  $("#modehelp").textContent = mode==="practice"
    ? "Check each answer as you go; hints available; timer counts up."
    : "No feedback until you submit; hints locked; timer counts down.";
}

/* ---------- start ---------- */
function start(tk, sk){
  let qs=[], label="", secs=0;
  const push=(topic,setKey)=>{
    const T=BANK[topic], st=T.sets[setKey];
    st.qs.forEach(q=>qs.push({...q, topic:T.name, set:setKey, uid:topic+"-"+setKey+"-"+q.id}));
    secs += st.block || st.qs.length*T.perQ;
  };
  if(tk==="ALL"){
    for(const t in BANK) for(const s in BANK[t].sets){ if(sk==="MIX"&&s!=="M") continue; push(t,s); }
    label = sk==="MIX" ? "Mixed Sets — all topics" : "Full Mock — all topics";
    if(sk==="ALL") shuffle(qs);
  } else if(sk==="ALL"){
    for(const s in BANK[tk].sets) push(tk,s);
    label = BANK[tk].name + " — full topic test";
  } else {
    push(tk,sk);
    label = BANK[tk].name + " · Set " + sk + " — " + BANK[tk].sets[sk].name;
  }
  S = { qs, label, i:0, ans:{}, marks:{}, hints:{}, checked:{}, done:false,
        limit:secs, elapsed:0, t0:Date.now(), mode };
  render();
  timerId = setInterval(tick, 1000);
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}
function tick(){
  if(S.done) return;
  S.elapsed = Math.round((Date.now()-S.t0)/1000);
  const el=$("#timer"); if(!el) return;
  if(S.mode==="exam"){
    const left = S.limit - S.elapsed;
    el.textContent = mmss(left);
    el.classList.toggle("low", left<=60);
    if(left<=0){ finish(); }
  } else el.textContent = mmss(S.elapsed);
}

/* ---------- test view ---------- */
function render(){
  const q = S.qs[S.i], n = S.qs.length;
  const showFB = S.mode==="practice" && S.checked[S.i];
  let h = `<div class="top"><div class="wrap"><div class="row">
      <strong style="font-size:14px">${S.label}</strong>
      <span class="pill">${S.mode==="exam"?"Exam":"Practice"}</span>
      <div class="sp" style="flex:1"></div>
      <span class="timer" id="timer">${S.mode==="exam"?mmss(S.limit):"0:00"}</span>
      <button class="btn ghost" id="quit">Exit</button>
    </div></div></div>
   <div class="wrap"><div class="card">
    <div class="qhead"><div class="qno">Question ${S.i+1} of ${n} &nbsp;·&nbsp; ${q.topic} · ${q.id} · ${q.t.toUpperCase()}</div>
      <button class="btn ghost" id="mark" style="padding:5px 11px;font-size:13px">${S.marks[S.i]?"★ Marked":"☆ Mark"}</button></div>
    <div class="qtext">${q.q}</div>`;
  if(q.t==="mcq"){
    q.o.forEach((o,i)=>{
      let cls="opt"+(S.ans[S.i]===i?" sel":"");
      if(showFB){ if(i===q.a) cls="opt correct"; else if(S.ans[S.i]===i) cls="opt wrong"; }
      h+=`<div class="${cls}" data-i="${i}"><div class="lab">${LET[i]}</div><div>${o}</div></div>`;
    });
  } else {
    h+=`<div class="row"><input type="text" id="tita" placeholder="Type your answer"
        value="${S.ans[S.i]!==undefined?String(S.ans[S.i]).replace(/"/g,'&quot;'):''}"
        ${showFB?"disabled":""} autocomplete="off">
        <small class="k">Decimals or fractions both fine (e.g. 5/3 or 1.67)</small></div>`;
  }
  if(S.hints[S.i]) h+=`<div class="note"><b>Hint:</b> ${q.h}</div>`;
  if(showFB){
    const ok = isRight(q, S.ans[S.i]);
    h+=`<div class="note ${ok?'good':'bad'}"><b>${ok?"Correct":"Incorrect"}</b> — answer: ${fmtAns(q)}</div>
        <div class="note sol">${q.s}</div>`;
  }
  h+=`<div class="pal" id="pal">`;
  S.qs.forEach((_,i)=>{
    let c=""; if(i===S.i)c+=" cur";
    if(S.mode==="practice"&&S.checked[i]) c+= isRight(S.qs[i],S.ans[i])?" ok":" no";
    else if(S.ans[i]!==undefined&&S.ans[i]!=="") c+=" ans";
    if(S.marks[i]) c+=" mk";
    h+=`<button class="${c.trim()}" data-i="${i}">${i+1}</button>`;
  });
  h+=`</div></div></div>
   <div class="foot"><div class="wrap">
     <button class="btn ghost" id="prev" ${S.i===0?"disabled":""}>← Prev</button>
     <button class="btn ghost" id="hint" ${S.mode==="exam"?"disabled":""}>${S.hints[S.i]?"Hint shown":"Hint"}</button>
     ${S.mode==="practice"&&!S.checked[S.i]?`<button class="btn" id="check">Check</button>`:""}
     <div class="sp"></div>
     <button class="btn ghost" id="submit">Submit test</button>
     <button class="btn" id="next">${S.i===S.qs.length-1?"Review →":"Next →"}</button>
   </div></div>`;
  app.innerHTML = h;
  wire();
}
function wire(){
  const q = S.qs[S.i];
  app.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{
    if(S.mode==="practice"&&S.checked[S.i])return;
    S.ans[S.i]=+o.dataset.i; render();
  });
  const ti=$("#tita");
  if(ti){ ti.oninput=()=>{S.ans[S.i]=ti.value;};
    ti.onkeydown=e=>{ if(e.key==="Enter"){ S.ans[S.i]=ti.value;
      if(S.mode==="practice"&&!S.checked[S.i]) S.checked[S.i]=true; else nav(1); render(); } };
    setTimeout(()=>ti.focus(),0); }
  $("#prev").onclick=()=>{save();nav(-1);render();};
  $("#next").onclick=()=>{save(); if(S.i===S.qs.length-1) finish(); else {nav(1);render();}};
  $("#hint").onclick=()=>{S.hints[S.i]=true;save();render();};
  const ck=$("#check"); if(ck) ck.onclick=()=>{save();S.checked[S.i]=true;render();};
  $("#mark").onclick=()=>{save();S.marks[S.i]=!S.marks[S.i];render();};
  $("#submit").onclick=()=>{save(); if(confirm("Submit and see your report?")) finish();};
  $("#quit").onclick=()=>{ if(confirm("Leave this test? Progress is lost.")) home(); };
  $("#pal").onclick=e=>{const b=e.target.closest("button");if(!b)return;save();S.i=+b.dataset.i;render();};
}
function save(){ const ti=$("#tita"); if(ti) S.ans[S.i]=ti.value; }
function nav(d){ S.i=Math.min(S.qs.length-1,Math.max(0,S.i+d)); }

/* ---------- results ---------- */
function finish(){
  S.done=true; clearInterval(timerId);
  const n=S.qs.length; let c=0,w=0,sk=0;
  const res = S.qs.map((q,i)=>{
    const v=S.ans[i];
    const blank = v===undefined||v===null||v==="";
    const ok = !blank && isRight(q,v);
    if(blank) sk++; else if(ok) c++; else w++;
    return {q,i,v,blank,ok};
  });
  const acc = (c+w)? Math.round(c/(c+w)*100):0;
  const t = S.mode==="exam" ? Math.min(S.elapsed,S.limit) : S.elapsed;
  let h=`<div class="wrap"><h1>Report — ${S.label}</h1>
   <div class="sub">${S.mode==="exam"?"Exam":"Practice"} mode · ${mmss(t)} taken · ${(t/n).toFixed(0)}s per question</div>
   <div class="stats">
     <div class="stat"><div class="v" style="color:var(--ok)">${c}</div><div class="l">Correct</div></div>
     <div class="stat"><div class="v" style="color:var(--bad)">${w}</div><div class="l">Wrong</div></div>
     <div class="stat"><div class="v" style="color:var(--dim)">${sk}</div><div class="l">Unattempted</div></div>
     <div class="stat"><div class="v">${acc}%</div><div class="l">Accuracy</div></div>
     <div class="stat"><div class="v">${c}/${n}</div><div class="l">Score</div></div>
   </div>`;
  // per-set breakdown
  const bySet={};
  res.forEach(r=>{const k=r.q.topic+" · Set "+r.q.set; (bySet[k]=bySet[k]||{c:0,n:0}); bySet[k].n++; if(r.ok)bySet[k].c++;});
  if(Object.keys(bySet).length>1){
    h+=`<h2>By set</h2><div class="card"><table style="width:100%;border-collapse:collapse;font-size:14px">`;
    for(const k in bySet){const b=bySet[k];const p=Math.round(b.c/b.n*100);
      h+=`<tr><td style="padding:6px 0">${k}</td><td style="text-align:right;color:var(--dim)">${b.c}/${b.n}</td>
      <td style="width:120px;padding-left:14px"><div style="background:var(--panel2);height:7px;border-radius:4px;overflow:hidden">
      <div style="width:${p}%;height:100%;background:${p>=70?'var(--ok)':p>=40?'var(--warn)':'var(--bad)'}"></div></div></td></tr>`;}
    h+=`</table></div>`;
  }
  h+=`<h2>Review</h2><div class="row" style="margin-bottom:12px">
      <div class="seg" id="filt">
        <button data-f="all" class="on">All</button>
        <button data-f="wrong">Wrong only</button>
        <button data-f="skip">Unattempted</button>
        <button data-f="mark">Marked</button>
      </div></div><div id="revlist">`;
  res.forEach(r=>{
    const cls = r.blank?"s":(r.ok?"c":"w");
    const f = r.blank?"skip":(r.ok?"right":"wrong");
    const yours = r.blank ? "<i style='color:var(--dim)'>not attempted</i>"
      : (r.q.t==="mcq" ? "("+LET[r.v]+") "+r.q.o[r.v] : String(r.v));
    h+=`<div class="rev ${cls}" data-f="${f}" data-m="${S.marks[r.i]?1:0}">
      <div class="row" style="margin-bottom:6px">
        <span class="tag">Q${r.i+1} · ${r.q.topic} · ${r.q.id}</span>
        ${S.marks[r.i]?'<span class="tag" style="color:var(--mark);border-color:var(--mark)">marked</span>':''}
        <span class="tag" style="color:${r.blank?'var(--dim)':r.ok?'var(--ok)':'var(--bad)'};border-color:currentColor">
          ${r.blank?"skipped":r.ok?"correct":"wrong"}</span></div>
      <div style="margin-bottom:8px">${r.q.q}</div>
      <div style="font-size:14px;color:var(--dim)">Your answer: <span style="color:var(--tx)">${yours}</span>
        &nbsp;·&nbsp; Correct: <span style="color:var(--ok)">${fmtAns(r.q)}</span></div>
      <div class="note sol" style="margin-top:10px">${r.q.s}</div>
      <div class="note" style="margin-top:8px"><b>Method:</b> ${r.q.h}</div>
    </div>`;
  });
  h+=`</div><div class="row" style="margin-top:20px">
      <button class="btn" id="again">Retry this set</button>
      <button class="btn ghost" id="hm">Back to menu</button></div></div>`;
  app.innerHTML=h; window.scrollTo(0,0);
  $("#hm").onclick=home;
  $("#again").onclick=()=>{ S.i=0;S.ans={};S.marks={};S.hints={};S.checked={};S.done=false;
    S.elapsed=0;S.t0=Date.now();S.mode=mode; render(); timerId=setInterval(tick,1000); };
  $("#filt").onclick=e=>{const b=e.target.closest("button");if(!b)return;
    [...e.currentTarget.children].forEach(c=>c.classList.toggle("on",c===b));
    const f=b.dataset.f;
    app.querySelectorAll("#revlist .rev").forEach(d=>{
      const show = f==="all" || (f==="mark" ? d.dataset.m==="1" : d.dataset.f===(f==="wrong"?"wrong":"skip"));
      d.classList.toggle("hide", !show);
    });};
}
home();
</script>
